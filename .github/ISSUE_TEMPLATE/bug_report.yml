name: Bug report / Báo lỗi
description: Something does not work as expected. / Có gì đó không hoạt động đúng.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! You can write in English or Vietnamese.
        **Never paste access tokens, passwords or private keys.** Security issues → see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / Chuyện gì đã xảy ra?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Các bước tái hiện
      placeholder: |
        1. Open repo …
        2. Switch account to …
        3. Push …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / Khu vực
      options:
        - Accounts / sign-in / switching
        - Clone / fetch / pull / push
        - Commit / staging / diff
        - Commit graph / history
        - Git LFS / large files
        - Branch / merge / rebase / conflicts
        - Pull requests / merge requests
        - UI / theme / translation
        - Install / update
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / Phiên bản app
      placeholder: "0.1.0 (Settings → Version)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS 15+
        - macOS 14 or earlier
        - Linux
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: git / git-lfs versions
      placeholder: "git version 2.47.0, git-lfs/3.5.1"
  - type: dropdown
    id: provider
    attributes:
      label: Provider(s) involved
      multiple: true
      options:
        - github.com
        - GitHub Enterprise Server
        - gitlab.com
        - GitLab self-hosted
        - Not provider related
  - type: textarea
    id: logs
    attributes:
      label: Logs / Nhật ký
      description: |
        Relevant lines from the log directory (Windows: %LOCALAPPDATA%\io.github.congluuit.nanomultiplegitgui\logs,
        macOS: ~/Library/Logs/io.github.congluuit.nanomultiplegitgui). Tokens are redacted automatically, but please double-check.
      render: text
