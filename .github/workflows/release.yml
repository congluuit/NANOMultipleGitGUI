name: Release

# Builds installers for every platform when a version tag (v1.2.3) is pushed and attaches them
# to a *draft* GitHub Release. A maintainer reviews the draft and publishes it by hand.
# Platforms: Windows x64 and ARM64 (ARM64 cross-compiled on the x64 runner), macOS universal
# (Apple silicon + Intel), Linux x64 and ARM64 (native ARM64 runner).
#
# Windows signing (SignPath Foundation) is opt-in: set the repository variable
# SIGNPATH_ENABLED=true plus SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
# SIGNPATH_SIGNING_POLICY_SLUG variables and the SIGNPATH_API_TOKEN secret.
# Until then the Windows installers are published unsigned (see docs/INSTALL-Windows.md).
#
# In-app updates (Check for Update) are opt-in too: set the TAURI_SIGNING_PRIVATE_KEY (+
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) secret and the NANOMGG_UPDATER_PUBKEY variable. Builds
# then also produce signed update packages (.sig) and a `latest.json` manifest. Without them
# the release is built exactly as before and the app says "updates not enabled".
# Publishing a *pre-release* copies its `latest.json` to the fixed `updater-beta` pre-release,
# which the app's beta channel reads (see docs/RELEASING.md).

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # Public OAuth client ids compiled into the app (repo Settings → Variables); empty = none.
  NANOMGG_GITHUB_OAUTH_CLIENT_ID: ${{ vars.NANOMGG_GITHUB_OAUTH_CLIENT_ID }}
  NANOMGG_GITLAB_OAUTH_CLIENT_ID: ${{ vars.NANOMGG_GITLAB_OAUTH_CLIENT_ID }}
  # Compiled into the app: About links + where to look for updates, and the key updates must
  # be signed with (public, not a secret).
  NANOMGG_GITHUB_REPO: ${{ github.repository }}
  NANOMGG_UPDATER_PUBKEY: ${{ vars.NANOMGG_UPDATER_PUBKEY }}
  UPDATER_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.NANOMGG_UPDATER_PUBKEY != '' }}
  BETA_TAG: updater-beta

jobs:
  create-release:
    name: Create draft release
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      updater: ${{ env.UPDATER_ENABLED }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # Earlier tags, for the release page's "Full Changelog" compare link.
          fetch-depth: 0
      # The update dialog shows `latest.json`'s notes: the CHANGELOG section of this version.
      - id: notes
        run: |
          notes=$(awk -v head="## [${TAG#v}]" '
            index($0, head) == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }' CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::warning::CHANGELOG.md has no section for ${TAG#v}; the update dialog will show no release notes."
          fi
          { echo "notes<<NANOMGG_NOTES_EOF"; echo "$notes"; echo "NANOMGG_NOTES_EOF"; } >> "$GITHUB_OUTPUT"
      # Release page = download/install instructions + this version's CHANGELOG section.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            body="$RUNNER_TEMP/release-body.md"
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
            {
              sed -e '/^<!--.*-->$/d' -e "s|{{VERSION}}|${TAG#v}|g" -e "s|{{TAG}}|$TAG|g" \
                -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" .github/release-notes.md
              echo
              echo "$NOTES"
              echo
              if [ -n "$prev" ]; then
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
              else
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md"
              fi
            } > "$body"
            gh release create "$TAG" --draft --verify-tag \
              --title "NANOMultipleGitGUI $TAG" \
              --notes-file "$body"
          fi
          echo "release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
          if [ "$UPDATER_ENABLED" != true ]; then
            echo "::notice::In-app updates disabled for this release (TAURI_SIGNING_PRIVATE_KEY secret or NANOMGG_UPDATER_PUBKEY variable missing)."
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
          # Native ARM64 runner (free for public repositories). Ubuntu 22.04 like the x64 build,
          # so the packages also run on older distros (glibc 2.35 or newer).
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev rpm
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - id: updater
        name: Enable signed update packages
        if: env.UPDATER_ENABLED == 'true'
        shell: bash
        run: |
          conf="$RUNNER_TEMP/updater.conf.json"
          jq -n --arg key "$NANOMGG_UPDATER_PUBKEY" \
            '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key}}}' > "$conf"
          echo "args=--config $conf" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: ${{ env.UPDATER_ENABLED == 'true' }}
          # Only used for latest.json's `notes` (the draft keeps its own body).
          releaseBody: ${{ needs.create-release.outputs.notes }}
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

  # Windows x64 and ARM64. ARM64 is cross-compiled on the x64 runner: its output lands in
  # target/aarch64-pc-windows-msvc/release and its installers are named `_arm64`, so nothing
  # clashes with the x64 files.
  windows-unsigned:
    name: Build (Windows ${{ matrix.arch }}, unsigned)
    needs: create-release
    if: vars.SIGNPATH_ENABLED != 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            args: ""
            out: target/release
          - arch: arm64
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
            out: target/aarch64-pc-windows-msvc/release
    env:
      ARCH: ${{ matrix.arch }}
      OUT: ${{ matrix.out }}
      TARGET_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # `ring` compiles its ARM64 assembly with clang; use the one shipped with Visual Studio.
      - name: Put Visual Studio's clang on PATH
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if ($vs) { "$vs\VC\Tools\Llvm\x64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          else { Write-Output "::warning::Visual Studio clang not found; using clang from PATH." }
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - id: updater
        name: Enable signed update packages
        if: env.UPDATER_ENABLED == 'true'
        shell: bash
        run: |
          conf=$(cygpath -m "$RUNNER_TEMP/updater.conf.json")
          jq -n --arg key "$NANOMGG_UPDATER_PUBKEY" \
            '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key}}}' > "$conf"
          echo "args=--config $conf" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: ${{ env.UPDATER_ENABLED == 'true' }}
          # Only used for latest.json's `notes` (the draft keeps its own body).
          releaseBody: ${{ needs.create-release.outputs.notes }}
          # The per-user NSIS installer is what updates use (and what the step-by-step installer runs).
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}
      - name: Build the step-by-step installer around the NSIS package
        shell: bash
        run: |
          nsis=$(ls "$OUT"/bundle/nsis/*_"$ARCH"-setup.exe | head -n 1)
          NANOMGG_SETUP_PAYLOAD=$(cygpath -w "$nsis") pnpm --filter @nanomgg/installer tauri build --no-bundle $TARGET_ARGS
          mkdir -p "$OUT/bundle/installer"
          cp "$OUT/nanomgg-setup.exe" "$OUT/bundle/installer/NANOMultipleGitGUI_${TAG#v}_${ARCH}_Installer.exe"
      - name: Upload the step-by-step installer to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --clobber "$OUT"/bundle/installer/*.exe

  # SignPath Foundation only signs artifacts produced by a verified GitHub Actions run, so the
  # app binaries and the installers are signed in two separate rounds:
  #   build exes -> sign app + credential helper -> bundle NSIS/MSI around them
  #   -> build the step-by-step installer around that NSIS package -> sign all three installers.
  # (The embedded NSIS package itself stays unsigned: it is extracted to a temp folder and run
  # silently by the signed step-by-step installer, and every binary it installs is signed.)
  # SignPath changes the installer bytes, so the update signatures (.sig) are made afterwards
  # from the final installers, and `updater-json` adds them to `latest.json`.
  # The SignPath artifact configurations must match both architectures (docs/SIGNPATH.md).
  windows-signed:
    name: Build (Windows ${{ matrix.arch }}, SignPath)
    needs: create-release
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            args: ""
            out: target/release
          - arch: arm64
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
            out: target/aarch64-pc-windows-msvc/release
    env:
      ARCH: ${{ matrix.arch }}
      OUT: ${{ matrix.out }}
      TARGET_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Put Visual Studio's clang on PATH
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if ($vs) { "$vs\VC\Tools\Llvm\x64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          else { Write-Output "::warning::Visual Studio clang not found; using clang from PATH." }
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - id: updater
        name: Embed the updater public key
        if: env.UPDATER_ENABLED == 'true'
        shell: bash
        run: |
          conf=$(cygpath -m "$RUNNER_TEMP/updater.conf.json")
          jq -n --arg key "$NANOMGG_UPDATER_PUBKEY" '{plugins: {updater: {pubkey: $key}}}' > "$conf"
          echo "args=--config $conf" >> "$GITHUB_OUTPUT"

      - name: Build app binary (no bundle)
        run: pnpm tauri build --no-bundle ${{ matrix.args }} ${{ steps.updater.outputs.args }}

      - id: upload-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe-${{ matrix.arch }}
          path: |
            ${{ matrix.out }}/nanomgg.exe
            ${{ matrix.out }}/nanomgg-credential.exe
          if-no-files-found: error
      - name: Sign app binary
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
      - name: Replace binaries with the signed ones
        shell: pwsh
        run: |
          Copy-Item signed-exe/nanomgg.exe "$env:OUT/nanomgg.exe" -Force
          # The bundler may take the sidecar from either place.
          Copy-Item signed-exe/nanomgg-credential.exe "$env:OUT/nanomgg-credential.exe" -Force
          Copy-Item signed-exe/nanomgg-credential.exe "apps/desktop/src-tauri/binaries/nanomgg-credential-${{ matrix.target }}.exe" -Force

      - name: Bundle installers around the signed binaries
        run: pnpm tauri bundle --bundles nsis,msi ${{ matrix.args }} ${{ steps.updater.outputs.args }}

      - name: Build the step-by-step installer around the NSIS package
        shell: bash
        run: |
          nsis=$(ls "$OUT"/bundle/nsis/*_"$ARCH"-setup.exe | head -n 1)
          NANOMGG_SETUP_PAYLOAD=$(cygpath -w "$nsis") pnpm --filter @nanomgg/installer tauri build --no-bundle $TARGET_ARGS
          mkdir -p "$OUT/bundle/installer"
          cp "$OUT/nanomgg-setup.exe" "$OUT/bundle/installer/NANOMultipleGitGUI_${TAG#v}_${ARCH}_Installer.exe"

      - id: upload-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers-${{ matrix.arch }}
          path: |
            ${{ matrix.out }}/bundle/nsis/*.exe
            ${{ matrix.out }}/bundle/msi/*.msi
            ${{ matrix.out }}/bundle/installer/*.exe
          if-no-files-found: error
      - name: Sign installers
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers

      - name: Sign update packages (the final, SignPath-signed installers)
        if: env.UPDATER_ENABLED == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Updates use the NSIS / MSI packages only.
          $files = Get-ChildItem signed-installers -Recurse -Include "*_${env:ARCH}-setup.exe", *.msi
          foreach ($f in $files) {
            pnpm tauri signer sign $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload signed installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          gh release upload "$TAG" --clobber signed-installers/**/*.exe signed-installers/**/*.msi signed-installers/**/*.sig

  # Every tauri-action build merges its own platforms into `latest.json` (read, change, upload),
  # so two builds finishing together can drop each other's entries, and the SignPath job writes
  # none. Once every build has finished this job is the only writer: it fills each missing
  # platform from the `.sig` files on the release (always rewriting the Windows entries after
  # SignPath re-signed the installers), then fails if a platform is still missing.
  # tauri-action lists at most 50 release assets when it looks up its uploads; a full release
  # has about 27 (with deb/rpm signatures), so keep an eye on that when adding platforms.
  updater-json:
    name: Complete latest.json
    needs: [create-release, build, windows-unsigned, windows-signed]
    if: ${{ !failure() && !cancelled() && needs.create-release.outputs.updater == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTES: ${{ needs.create-release.outputs.notes }}
          SIGNPATH: ${{ vars.SIGNPATH_ENABLED }}
        run: |
          set -euo pipefail
          mkdir manifest && cd manifest
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --pattern '*.sig'
          if [ ! -f latest.json ]; then
            jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "$NOTES" \
              '{version: $v, notes: $n, pub_date: $d, platforms: {}}' > latest.json
          fi
          base="https://github.com/$REPO/releases/download/$TAG"
          first() { find . -maxdepth 1 -name "$1" -printf '%f\n' | sort | head -n 1; }
          # put KEY FILE.sig [force]: adds the entry unless it exists (always with force).
          put() {
            [ -n "$2" ] || return 0
            if [ -z "${3:-}" ] && jq -e --arg k "$1" '.platforms[$k]' latest.json > /dev/null; then
              return 0
            fi
            jq --arg key "$1" --arg url "$base/${2%.sig}" --rawfile sig "$2" \
              '.platforms[$key] = {signature: ($sig | gsub("\\s+$"; "")), url: $url}' \
              latest.json > latest.tmp && mv latest.tmp latest.json
            echo "$1 <- ${2%.sig}"
          }
          # Windows: the NSIS installer is the default package, like updaterJsonPreferNsis.
          force=""
          if [ "$SIGNPATH" = true ]; then force=1; fi
          for pair in x64:x86_64 arm64:aarch64; do
            asset=${pair%%:*}
            arch=${pair#*:}
            nsis=$(first "*_${asset}-setup.exe.sig")
            msi=$(first "*_${asset}_*.msi.sig")
            put "windows-$arch" "$nsis" $force
            put "windows-$arch-nsis" "$nsis" $force
            put "windows-$arch-msi" "$msi" $force
          done
          # Linux: arch, AppImage arch, deb arch, rpm arch (the AppImage is the default package).
          linux() {
            app=$(first "*_$2.AppImage.sig")
            put "linux-$1" "$app"
            put "linux-$1-appimage" "$app"
            put "linux-$1-deb" "$(first "*_$3.deb.sig")"
            put "linux-$1-rpm" "$(first "*.$4.rpm.sig")"
          }
          linux x86_64 amd64 amd64 x86_64
          linux aarch64 aarch64 arm64 aarch64
          # macOS: one universal app serves both architectures.
          mac=$(first "*.app.tar.gz.sig")
          for arch in aarch64 x86_64; do
            put "darwin-$arch" "$mac"
            put "darwin-$arch-app" "$mac"
          done
          cat latest.json
          gh release upload "$TAG" --repo "$REPO" --clobber latest.json
          missing=""
          for key in windows-x86_64 windows-aarch64 darwin-aarch64 darwin-x86_64 linux-x86_64 linux-aarch64; do
            jq -e --arg k "$key" '.platforms[$k].signature | length > 0' latest.json > /dev/null \
              || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "::error::latest.json has no update package for:$missing. Rebuild the tag (Run workflow)."
            exit 1
          fi

  checksums:
    name: SHA-256 checksums
    needs: [create-release, build, windows-unsigned, windows-signed, updater-json]
    if: ${{ github.event_name != 'release' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$REPO" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" --repo "$REPO" --clobber SHA256SUMS.txt

  # The beta channel reads `releases/download/updater-beta/latest.json`: when a pre-release is
  # published, its manifest is copied there. Stable releases need nothing: `releases/latest`
  # already points at them, and beta users check both manifests.
  beta-channel:
    name: Update beta channel manifest
    if: github.event_name == 'release' && github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir manifest && cd manifest
          if ! gh release download "$TAG" --repo "$REPO" --pattern latest.json; then
            echo "::notice::$TAG has no latest.json (update signing not enabled); beta channel unchanged."
            exit 0
          fi
          if ! gh release view "$BETA_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$BETA_TAG" --repo "$REPO" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Beta channel (in-app updater)" \
              --notes "Holds latest.json of the newest beta for the in-app updater's beta channel. Do not delete; download betas from their own release."
          fi
          gh release upload "$BETA_TAG" --repo "$REPO" --clobber latest.json
