name: Release

# Builds installers for every platform when a version tag (v1.2.3) is pushed and attaches them
# to a *draft* GitHub Release. A maintainer reviews the draft and publishes it by hand.
#
# Windows signing (SignPath Foundation) is opt-in: set the repository variable
# SIGNPATH_ENABLED=true plus SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
# SIGNPATH_SIGNING_POLICY_SLUG variables and the SIGNPATH_API_TOKEN secret.
# Until then the Windows installers are published unsigned (see docs/INSTALL-Windows.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # Public OAuth client ids compiled into the app (repo Settings → Variables); empty = none.
  NANOMGG_GITHUB_OAUTH_CLIENT_ID: ${{ vars.NANOMGG_GITHUB_OAUTH_CLIENT_ID }}
  NANOMGG_GITLAB_OAUTH_CLIENT_ID: ${{ vars.NANOMGG_GITLAB_OAUTH_CLIENT_ID }}

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "NANOMultipleGitGUI ${TAG#v}" \
              --notes-file .github/release-notes.md
          fi
          echo "release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev rpm
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  windows-unsigned:
    name: Build (Windows x64, unsigned)
    needs: create-release
    if: vars.SIGNPATH_ENABLED != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: false

  # SignPath Foundation only signs artifacts produced by a verified GitHub Actions run, so the
  # app exe and the installers are signed in two separate rounds:
  #   build exe -> sign exe -> bundle NSIS/MSI around the signed exe -> sign installers.
  windows-signed:
    name: Build (Windows x64, SignPath)
    needs: create-release
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile

      - name: Build app binary (no bundle)
        run: pnpm tauri build --no-bundle

      - id: upload-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: target/release/nanomgg.exe
          if-no-files-found: error
      - name: Sign app binary
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
      - name: Replace binary with signed one
        shell: pwsh
        run: Copy-Item signed-exe/nanomgg.exe target/release/nanomgg.exe -Force

      - name: Bundle installers around the signed binary
        run: pnpm tauri bundle --bundles nsis,msi

      - id: upload-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Sign installers
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers

      - name: Upload signed installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          gh release upload "$TAG" --clobber signed-installers/**/*.exe signed-installers/**/*.msi

  checksums:
    name: SHA-256 checksums
    needs: [create-release, build, windows-unsigned, windows-signed]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$REPO" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" --repo "$REPO" --clobber SHA256SUMS.txt
