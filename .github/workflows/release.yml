name: Release

# Builds installers for every platform when a version tag (v1.2.3) is pushed and attaches them
# to a *draft* GitHub Release. A maintainer reviews the draft and publishes it by hand.
#
# Windows signing (SignPath Foundation) is opt-in: set the repository variable
# SIGNPATH_ENABLED=true plus SIGNPATH_ORGANIZATION_ID / SIGNPATH_PROJECT_SLUG /
# SIGNPATH_SIGNING_POLICY_SLUG variables and the SIGNPATH_API_TOKEN secret.
# Until then the Windows installers are published unsigned (see docs/INSTALL-Windows.md).
#
# In-app updates (Check for Update) are opt-in too: set the TAURI_SIGNING_PRIVATE_KEY (+
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) secret and the NANOMGG_UPDATER_PUBKEY variable. Builds
# then also produce signed update packages (.sig) and a `latest.json` manifest. Without them
# the release is built exactly as before and the app says "updates not enabled".
# Publishing a *pre-release* copies its `latest.json` to the fixed `updater-beta` pre-release,
# which the app's beta channel reads (see docs/RELEASING.md).

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # Public OAuth client ids compiled into the app (repo Settings → Variables); empty = none.
  NANOMGG_GITHUB_OAUTH_CLIENT_ID: ${{ vars.NANOMGG_GITHUB_OAUTH_CLIENT_ID }}
  NANOMGG_GITLAB_OAUTH_CLIENT_ID: ${{ vars.NANOMGG_GITLAB_OAUTH_CLIENT_ID }}
  # Compiled into the app: About links + where to look for updates, and the key updates must
  # be signed with (public, not a secret).
  NANOMGG_GITHUB_REPO: ${{ github.repository }}
  NANOMGG_UPDATER_PUBKEY: ${{ vars.NANOMGG_UPDATER_PUBKEY }}
  UPDATER_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && vars.NANOMGG_UPDATER_PUBKEY != '' }}
  BETA_TAG: updater-beta

jobs:
  create-release:
    name: Create draft release
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      updater: ${{ env.UPDATER_ENABLED }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          # Earlier tags, for the release page's "Full Changelog" compare link.
          fetch-depth: 0
      # The update dialog shows `latest.json`'s notes: the CHANGELOG section of this version.
      - id: notes
        run: |
          notes=$(awk -v head="## [${TAG#v}]" '
            index($0, head) == 1 { on = 1; next }
            on && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            on { print }' CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::warning::CHANGELOG.md has no section for ${TAG#v}; the update dialog will show no release notes."
          fi
          { echo "notes<<NANOMGG_NOTES_EOF"; echo "$notes"; echo "NANOMGG_NOTES_EOF"; } >> "$GITHUB_OUTPUT"
      # Release page = download/install instructions + this version's CHANGELOG section.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            body="$RUNNER_TEMP/release-body.md"
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
            {
              sed -e '/^<!--.*-->$/d' -e "s|{{VERSION}}|${TAG#v}|g" -e "s|{{TAG}}|$TAG|g" \
                -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" .github/release-notes.md
              echo
              echo "$NOTES"
              echo
              if [ -n "$prev" ]; then
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
              else
                echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md"
              fi
            } > "$body"
            gh release create "$TAG" --draft --verify-tag \
              --title "NANOMultipleGitGUI $TAG" \
              --notes-file "$body"
          fi
          echo "release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
          if [ "$UPDATER_ENABLED" != true ]; then
            echo "::notice::In-app updates disabled for this release (TAURI_SIGNING_PRIVATE_KEY secret or NANOMGG_UPDATER_PUBKEY variable missing)."
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev rpm
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - id: updater
        name: Enable signed update packages
        if: env.UPDATER_ENABLED == 'true'
        shell: bash
        run: |
          conf="$RUNNER_TEMP/updater.conf.json"
          jq -n --arg key "$NANOMGG_UPDATER_PUBKEY" \
            '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key}}}' > "$conf"
          echo "args=--config $conf" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: ${{ env.UPDATER_ENABLED == 'true' }}
          # Only used for latest.json's `notes` (the draft keeps its own body).
          releaseBody: ${{ needs.create-release.outputs.notes }}
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

  windows-unsigned:
    name: Build (Windows x64, unsigned)
    needs: create-release
    if: vars.SIGNPATH_ENABLED != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - id: updater
        name: Enable signed update packages
        if: env.UPDATER_ENABLED == 'true'
        shell: bash
        run: |
          conf=$(cygpath -m "$RUNNER_TEMP/updater.conf.json")
          jq -n --arg key "$NANOMGG_UPDATER_PUBKEY" \
            '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key}}}' > "$conf"
          echo "args=--config $conf" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: ${{ env.UPDATER_ENABLED == 'true' }}
          # Only used for latest.json's `notes` (the draft keeps its own body).
          releaseBody: ${{ needs.create-release.outputs.notes }}
          # The per-user NSIS installer is what updates use (and what the step-by-step installer runs).
          updaterJsonPreferNsis: true
          args: ${{ steps.updater.outputs.args }}
      - name: Build the step-by-step installer around the NSIS package
        shell: bash
        run: |
          nsis=$(ls target/release/bundle/nsis/*_x64-setup.exe | head -n 1)
          NANOMGG_SETUP_PAYLOAD=$(cygpath -w "$nsis") pnpm --filter @nanomgg/installer tauri build --no-bundle
          mkdir -p target/release/bundle/installer
          cp target/release/nanomgg-setup.exe "target/release/bundle/installer/NANOMultipleGitGUI_${TAG#v}_x64_Installer.exe"
      - name: Upload the step-by-step installer to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --clobber target/release/bundle/installer/*.exe

  # SignPath Foundation only signs artifacts produced by a verified GitHub Actions run, so the
  # app binaries and the installers are signed in two separate rounds:
  #   build exes -> sign app + credential helper -> bundle NSIS/MSI around them
  #   -> build the step-by-step installer around that NSIS package -> sign all three installers.
  # (The embedded NSIS package itself stays unsigned: it is extracted to a temp folder and run
  # silently by the signed step-by-step installer, and every binary it installs is signed.)
  # SignPath changes the installer bytes, so the update signatures (.sig) are made afterwards
  # from the final installers, and `windows-updater-json` adds them to `latest.json`.
  windows-signed:
    name: Build (Windows x64, SignPath)
    needs: create-release
    if: vars.SIGNPATH_ENABLED == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - id: updater
        name: Embed the updater public key
        if: env.UPDATER_ENABLED == 'true'
        shell: bash
        run: |
          conf=$(cygpath -m "$RUNNER_TEMP/updater.conf.json")
          jq -n --arg key "$NANOMGG_UPDATER_PUBKEY" '{plugins: {updater: {pubkey: $key}}}' > "$conf"
          echo "args=--config $conf" >> "$GITHUB_OUTPUT"

      - name: Build app binary (no bundle)
        run: pnpm tauri build --no-bundle ${{ steps.updater.outputs.args }}

      - id: upload-exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-exe
          path: |
            target/release/nanomgg.exe
            target/release/nanomgg-credential.exe
          if-no-files-found: error
      - name: Sign app binary
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app-exe
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
      - name: Replace binaries with the signed ones
        shell: pwsh
        run: |
          Copy-Item signed-exe/nanomgg.exe target/release/nanomgg.exe -Force
          # The bundler may take the sidecar from either place.
          Copy-Item signed-exe/nanomgg-credential.exe target/release/nanomgg-credential.exe -Force
          Copy-Item signed-exe/nanomgg-credential.exe apps/desktop/src-tauri/binaries/nanomgg-credential-x86_64-pc-windows-msvc.exe -Force

      - name: Bundle installers around the signed binaries
        run: pnpm tauri bundle --bundles nsis,msi ${{ steps.updater.outputs.args }}

      - name: Build the step-by-step installer around the NSIS package
        shell: bash
        run: |
          nsis=$(ls target/release/bundle/nsis/*_x64-setup.exe | head -n 1)
          NANOMGG_SETUP_PAYLOAD=$(cygpath -w "$nsis") pnpm --filter @nanomgg/installer tauri build --no-bundle
          mkdir -p target/release/bundle/installer
          cp target/release/nanomgg-setup.exe "target/release/bundle/installer/NANOMultipleGitGUI_${TAG#v}_x64_Installer.exe"

      - id: upload-installers
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/installer/*.exe
          if-no-files-found: error
      - name: Sign installers
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers

      - name: Sign update packages (the final, SignPath-signed installers)
        if: env.UPDATER_ENABLED == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Updates use the NSIS / MSI packages only.
          $files = Get-ChildItem signed-installers -Recurse -Include *_x64-setup.exe, *.msi
          foreach ($f in $files) {
            pnpm tauri signer sign $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload signed installers to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob
          gh release upload "$TAG" --clobber signed-installers/**/*.exe signed-installers/**/*.msi signed-installers/**/*.sig

  # tauri-action writes `latest.json` for macOS/Linux; the SignPath job does not use it, so its
  # Windows entries are added here once every build has finished (no concurrent writers).
  windows-updater-json:
    name: Add Windows to latest.json
    needs: [create-release, build, windows-signed]
    if: ${{ !failure() && !cancelled() && vars.SIGNPATH_ENABLED == 'true' && needs.create-release.outputs.updater == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTES: ${{ needs.create-release.outputs.notes }}
        run: |
          mkdir manifest && cd manifest
          gh release download "$TAG" --repo "$REPO" --pattern latest.json \
            --pattern '*_x64-setup.exe.sig' --pattern '*_x64_*.msi.sig'
          if [ ! -f latest.json ]; then
            jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "$NOTES" \
              '{version: $v, notes: $n, pub_date: $d, platforms: {}}' > latest.json
          fi
          base="https://github.com/$REPO/releases/download/$TAG"
          add() {
            [ -n "$2" ] || return 0
            jq --arg key "$1" --arg url "$base/${2%.sig}" --rawfile sig "$2" \
              '.platforms[$key] = {signature: ($sig | gsub("\\s+$"; "")), url: $url}' \
              latest.json > latest.tmp && mv latest.tmp latest.json
          }
          nsis=$(find . -maxdepth 1 -name '*_x64-setup.exe.sig' -printf '%f\n' | head -n 1)
          msi=$(find . -maxdepth 1 -name '*_x64_*.msi.sig' -printf '%f\n' | head -n 1)
          add windows-x86_64 "$nsis"
          add windows-x86_64-nsis "$nsis"
          add windows-x86_64-msi "$msi"
          cat latest.json
          gh release upload "$TAG" --repo "$REPO" --clobber latest.json

  checksums:
    name: SHA-256 checksums
    needs: [create-release, build, windows-unsigned, windows-signed, windows-updater-json]
    if: ${{ github.event_name != 'release' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$REPO" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" --repo "$REPO" --clobber SHA256SUMS.txt

  # The beta channel reads `releases/download/updater-beta/latest.json`: when a pre-release is
  # published, its manifest is copied there. Stable releases need nothing — `releases/latest`
  # already points at them, and beta users check both manifests.
  beta-channel:
    name: Update beta channel manifest
    if: github.event_name == 'release' && github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir manifest && cd manifest
          if ! gh release download "$TAG" --repo "$REPO" --pattern latest.json; then
            echo "::notice::$TAG has no latest.json (update signing not enabled); beta channel unchanged."
            exit 0
          fi
          if ! gh release view "$BETA_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$BETA_TAG" --repo "$REPO" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Beta channel (in-app updater)" \
              --notes "Holds latest.json of the newest beta for the in-app updater's beta channel. Do not delete; download betas from their own release."
          fi
          gh release upload "$BETA_TAG" --repo "$REPO" --clobber latest.json
