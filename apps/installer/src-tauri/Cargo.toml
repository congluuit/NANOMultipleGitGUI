[package]
name = "nanomgg-setup"
description = "NANOMultipleGitGUI Setup — step-by-step Windows installer around the NSIS package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "nanomgg-setup"
path = "src/main.rs"
# No unit tests; skipping the harness also avoids linking the dialog plugin's comctl32 v6
# imports into a test binary without the app manifest (see apps/desktop/src-tauri/build.rs).
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[lints]
workspace = true
