specta = ["dep:specta"]

[dependencies]
getrandom = "0.3"
regex = { workspace = true }
serde = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
