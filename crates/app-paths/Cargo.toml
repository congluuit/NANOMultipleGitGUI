[package]
name = "nanomgg-app-paths"
description = "Log / cache / app-data locations of NANOMultipleGitGUI: pointer file, safe moves, cleanup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Derives `specta::Type` on public data types so the app can export them to TypeScript.
specta = ["dep:specta"]

[dependencies]
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Free disk space of the volume holding a folder (safe API).
fs4 = "1"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
