[package]
name = "nanomgg-backup"
description = "Encrypted account-config export/import and full app backup/restore (Phase 6.3 / 6.6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Derives `specta::Type` on public data types so the app can export them to TypeScript.
specta = ["dep:specta", "nanomgg-accounts/specta"]

[dependencies]
nanomgg-accounts = { workspace = true }
nanomgg-credentials = { workspace = true }
nanomgg-ssh-keys = { workspace = true }
nanomgg-storage = { workspace = true }
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
# Password → key (Argon2id) and authenticated encryption (XChaCha20-Poly1305), RustCrypto.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
base64 = "0.22"
getrandom = "0.3"
zeroize = { version = "1", features = ["serde"] }

[lints]
workspace = true
