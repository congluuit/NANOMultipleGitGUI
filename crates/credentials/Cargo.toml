[package]
name = "nanomgg-credentials"
description = "OS keychain access and the IPC server used by the credential helper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Real OS keychain backend (`OsKeychain`). Enabled by the app only, so the
# `nanomgg-credential` sidecar stays small and never links keychain code.
os-keychain = ["dep:keyring"]

[dependencies]
getrandom = "0.3"
interprocess = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
# Native stores only, no OpenSSL: Windows Credential Manager, macOS Keychain, and Linux
# Secret Service over zbus (pure Rust) with pure-Rust crypto. keyring picks the backend per
# target, so enabling all three here is fine.
keyring = { version = "3.6", optional = true, default-features = false, features = [
    "windows-native",
    "apple-native",
    "async-secret-service",
    "tokio",
    "crypto-rust",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
