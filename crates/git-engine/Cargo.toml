[package]
name = "nanomgg-git-engine"
description = "Git CLI runner and gitoxide-based reader for NANOMultipleGitGUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Derives `specta::Type` on public data types so the app can export them to TypeScript.
specta = ["dep:specta"]

[dependencies]
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
notify-debouncer-mini = "0.7"
serde = { workspace = true }
thiserror = { workspace = true }

# Kill-on-close Job Object so cancelling a command also stops its descendants (see src/job.rs).
[target.'cfg(windows)'.dependencies]
win32job = "2"

[dev-dependencies]
nanomgg-test-git-server = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
