[package]
name = "nanomgg-import"
description = "Read-only scanners of ~/.gitconfig, ~/.ssh/config, gh and glab configs that suggest accounts, identities, rules and SSH keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Derives `specta::Type` on public data types so the app can export them to TypeScript.
specta = ["dep:specta"]

[dependencies]
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
nanomgg-ssh-keys = { workspace = true }
serde = { workspace = true }
# Pure-Rust YAML 1.2 parser for gh `hosts.yml` / glab `config.yml` (no `encoding` feature:
# the files are UTF-8).
yaml-rust2 = { version = "0.13", default-features = false }
thiserror = { workspace = true }
zeroize = "1"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
