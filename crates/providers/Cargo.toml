[package]
name = "nanomgg-providers"
description = "GitHub and GitLab API clients behind a common Provider trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Derives `specta::Type` on public data types so the app can export them to TypeScript.
specta = ["dep:specta"]

[dependencies]
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
# rustls with the `ring` provider: no OpenSSL, no cmake/NASM toolchain (see docs/adr/0005).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "query", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["time", "macros"] }
tokio-util = "0.7"
url = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
wiremock = "0.6"

[lints]
workspace = true
