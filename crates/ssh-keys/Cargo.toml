[package]
name = "nanomgg-ssh-keys"
description = "SSH key generation/import, private key storage and GIT_SSH_COMMAND / known_hosts helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Derives `specta::Type` on public data types so the app can export them to TypeScript.
specta = ["dep:specta"]

[dependencies]
specta = { version = "=2.0.0-rc.25", features = ["derive"], optional = true }
# `ed25519` for generation, `encryption` for OpenSSH bcrypt-pbkdf + AES key files,
# `getrandom` for the OS RNG (`OsRng`). Default features keep ECDSA parsing for imports.
ssh-key = { version = "0.6.7", features = ["ed25519", "encryption", "getrandom"] }
serde = { workspace = true }
thiserror = { workspace = true }
# Atomic, no-clobber writes (`persist_noclobber`) of key files.
tempfile = { workspace = true }
zeroize = "1"

[lints]
workspace = true
