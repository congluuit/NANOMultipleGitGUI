<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1120"
  height="440"
  viewBox="0 0 1120 440"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Many accounts. One Git workspace.</title>
  <desc id="desc">
    Concept diagram: personal GitHub, work GitHub and self-hosted GitLab repositories each keep
    their own account context for commit identity, HTTPS credentials, SSH keys and Git LFS.
  </desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#201d1b" />
      <stop offset="1" stop-color="#302823" />
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#ffb572" />
      <stop offset="1" stop-color="#f7773b" />
    </linearGradient>
  </defs>
  <rect width="1120" height="440" rx="24" fill="url(#bg)" />
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="52" y="59" fill="#ffb572" font-size="13" font-weight="700" letter-spacing="3">
      NANO MULTIPLE GIT GUI
    </text>
    <text x="52" y="106" fill="#fff5ed" font-size="36" font-weight="700">
      Many accounts. One Git workspace.
    </text>
    <text x="52" y="138" fill="#d3c2b7" font-size="17">
      Keep the right identity with every repository.
    </text>
    <g fill="none" stroke="#8c6b55" stroke-width="2">
      <path d="M350 219 H418 Q438 219 438 239 V290 H481" />
      <path d="M350 290 H481" />
      <path d="M350 361 H418 Q438 361 438 341 V290" />
      <path d="M733 290 H781" stroke="#ffb572" />
    </g>
    <g fill="#342d28" stroke="#695345">
      <rect x="52" y="188" width="298" height="62" rx="12" />
      <rect x="52" y="259" width="298" height="62" rx="12" />
      <rect x="52" y="330" width="298" height="62" rx="12" />
    </g>
    <circle cx="79" cy="219" r="6" fill="#ffb572" />
    <circle cx="79" cy="290" r="6" fill="#98c9ee" />
    <circle cx="79" cy="361" r="6" fill="#b5d6a1" />
    <g fill="#fff5ed" font-size="16" font-weight="600">
      <text x="98" y="215">Personal / GitHub</text>
      <text x="98" y="286">Work / GitHub</text>
      <text x="98" y="357">Team / GitLab self-hosted</text>
    </g>
    <g fill="#d3c2b7" font-size="12">
      <text x="98" y="234">~/Projects/personal</text>
      <text x="98" y="305">~/Projects/work</text>
      <text x="98" y="376">~/Projects/team</text>
    </g>
    <rect x="481" y="230" width="252" height="120" rx="16" fill="#493024" stroke="#ffb572" />
    <text x="607" y="268" fill="#fff5ed" font-size="21" font-weight="700" text-anchor="middle">
      Account context
    </text>
    <text x="607" y="297" fill="#f8d5b9" font-size="14" text-anchor="middle">
      Repository bindings + rules
    </text>
    <text x="607" y="323" fill="#f8d5b9" font-size="14" text-anchor="middle">
      Visible before you act
    </text>
    <rect x="781" y="200" width="287" height="180" rx="16" fill="#342d28" stroke="#695345" />
    <rect x="803" y="224" width="4" height="130" rx="2" fill="url(#accent)" />
    <g fill="#fff5ed" font-size="17">
      <text x="824" y="242">Commit name + email</text>
      <text x="824" y="276">HTTPS credentials</text>
      <text x="824" y="310">SSH key</text>
      <text x="824" y="344">Git LFS transfers</text>
    </g>
    <text x="1068" y="418" fill="#b8a89c" font-size="11" text-anchor="end">
      Concept diagram · not an app screenshot
    </text>
  </g>
</svg>
